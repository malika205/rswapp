name: WALL STREET 2.0 - Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate version 2 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          # Also support a directly uploaded ZIP if this workflow was added separately.
          if [ -f WALL_STREET_READY.zip ]; then
            mkdir -p "$RUNNER_TEMP/wall-street-v2"
            unzip -oq WALL_STREET_READY.zip -d "$RUNNER_TEMP/wall-street-v2"
            project="$RUNNER_TEMP/wall-street-v2"
          elif [ -f package.json ] && [ -f src/main.tsx ]; then
            project="$GITHUB_WORKSPACE"
          else
            echo 'Upload the extracted ZIP contents, including src and package.json, to the repository root.'
            exit 1
          fi
          cd "$project"
          test -f package-lock.json
          test -f src/components/Tutorial.tsx
          test -f src/components/ResultScreen.tsx
          test -f src/components/AssetIcon.tsx
          grep -Fq 'WALL STREET 2.0' src/components/TitleScreen.tsx
          grep -Fq 'career-entry' src/components/TitleScreen.tsx
          node -e 'if(require("./package.json").version !== "2.0.0") process.exit(1)'
          echo "dir=$project" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies and build
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          grep -R -Fq --include='*.js' 'WALL STREET 2.0' dist
          grep -R -Fq --include='*.js' 'career-entry' dist
      - name: Create and build Android application
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          cd android
          sed -i -E 's/^[[:space:]]*versionCode[[:space:]]+[0-9]+/        versionCode 2/; s/^[[:space:]]*versionName[[:space:]]+.*/        versionName "2.0.0"/' app/build.gradle
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/WALL_STREET_2.0.apk"
      - name: Verify that APK contains the new game
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PYAPK'
          from pathlib import Path
          import os, zipfile
          apk = Path(os.environ['RUNNER_TEMP']) / 'WALL_STREET_2.0.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              files = [p for p in Path('dist').rglob('*') if p.is_file()]
              assert files
              for p in files:
                  assert z.read('assets/public/' + p.relative_to('dist').as_posix()) == p.read_bytes(), p
              print('Verified',len(files),'web files inside APK')
          PYAPK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL_STREET_2.0_ANDROID
          path: ${{ runner.temp }}/WALL_STREET_2.0.apk
          if-no-files-found: error
