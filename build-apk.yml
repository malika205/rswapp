
name: Build WALL STREET 2.0 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build updated game
        shell: bash
        run: |
          cd "WALL_STREET_v2 (2)/app"

          pwd
          test -f src/components/Tutorial.tsx
          grep -Fq 'career-entry' src/components/TitleScreen.tsx

          npm install
          npm run build

          grep -R -Fq --include='*.js' 'career-entry' dist

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init "WALL STREET 2.0" com.wallstreet.trader --web-dir dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WALL_STREET_2.0.apk"

      - name: Upload updated APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL_STREET_2.0
          path: WALL_STREET_2.0.apk
          if-no-files-found: error
