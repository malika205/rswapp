
name: Build WALL STREET 2.0 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        shell: bash
        run: |
          if [ -f "WALL_STREET_v2 (2)/app/package.json" ]; then
            cd "WALL_STREET_v2 (2)/app"
          elif [ -f "WALL_STREET_v2 (2)/package.json" ]; then
            cd "WALL_STREET_v2 (2)"
          else
            echo "Updated game not found"
            exit 1
          fi

          npm install
          npm run build

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            npx cap init 'WALL STREET 2.0' com.wallstreet.trader --web-dir dist
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WALL_STREET_v2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WALL_STREET_v2
          path: WALL_STREET_v2.apk
          if-no-files-found: error
